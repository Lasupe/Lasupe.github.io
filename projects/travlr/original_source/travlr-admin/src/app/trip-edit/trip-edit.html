<h2>Edit Trip</h2>

<form (ngSubmit)="onSubmit()">
  <p>
    <label>Code:</label><br>
    <input type="text" [(ngModel)]="formData.code" name="code">
  </p>

  <p>
    <label>Name:</label><br>
    <input type="text" [(ngModel)]="formData.name" name="name">
  </p>

  <p>
    <label>Length:</label><br>
    <input type="text" [(ngModel)]="formData.length" name="length">
  </p>

  <p>
    <label>Start Date:</label><br>
    <input type="date" [(ngModel)]="formData.start" name="start">
  </p>

  <p>
    <label>Resort:</label><br>
    <input type="text" [(ngModel)]="formData.resort" name="resort">
  </p>

  <p>
    <label>Price:</label><br>
    <input type="text" [(ngModel)]="formData.perPerson" name="perPerson">
  </p>

  <p>
    <label>Image:</label><br>
    <input type="text" [(ngModel)]="formData.image" name="image">
  </p>

  <p>
    <label>Description:</label><br>
    <textarea [(ngModel)]="formData.description" name="description"></textarea>
  </p>

  <button type="submit">Update Trip</button>
</form>

<p>{{ message }}</p>
